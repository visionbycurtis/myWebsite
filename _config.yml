# Site settings
title: "VISION BY CURTIS | Fotograf & Videograf Neusiedl am See, Wien & Burgenland"
email: "info@curtis.at"
description: "Professioneller Fotograf & Videograf in Neusiedl am See, Wien und Burgenland. Spezialisiert auf Hochzeiten, Portraits, Akt und Events. Kreative Fotografie mit Leidenschaft."
url: "https://curtis.at"
baseurl: "" # Meistens leer lassen, wenn die Seite direkt unter curtis.at erreichbar ist
facebook_username: "visionbycurtis"
instagram_username: "vision_by_curtis"
github_username: "visionbycurtis"
share: true

# Owner/author information
owner:
  name: "Vision by Curtis"
  avatar: "avatar.png"
  favicon: "favicon.ico"
  info: "Ihr Fotograf in Neusiedl am See & Wien. Kreative Fotografie für Hochzeiten, Events, Business und Portraits im gesamten Burgenland und Niederösterreich."
  location: "Neusiedl am See, Austria"

# Internal nav
nav:
  - PORTFOLIO: "https://curtis.at/portfolio/"
  - ANGEBOTE: "https://curtis.at/angebote/"
  - ABOUT: "https://curtis.at/about/"

# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty
paginate: 5
paginate_path: "/journal/page:num/"

# Plugins (WICHTIG: Das aktiviert die Sitemap und SEO-Tags automatisch)
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-seo-tag

exclude: ["less","node_modules","Gruntfile.js","package.json","README.md"]

# Sitemap Einstellungen
sitemap:
  exclude:
    - "/404.html"
    - "/atom.xml"
    - "/feed.xml"